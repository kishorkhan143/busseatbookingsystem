<!doctype html>
<html lang="en" class="h-full w-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SeatEase - Online Seat Booking System</title>
    <meta name="description" content="A RedBus-inspired online bus seat booking system with interactive 30-seat layout, real-time availability, passenger booking, ticket confirmation, and complete Java OOP JDBC backend architecture." />
    <meta property="og:title" content="SeatEase - Online Seat Booking System" />
    <meta property="og:description" content="A RedBus-inspired online bus seat booking system with interactive 30-seat layout, real-time availability, passenger booking, ticket confirmation, and complete Java OOP JDBC backend architecture." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('seatease_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#070C16] dark:text-slate-100 antialiased h-full w-full overflow-hidden transition-colors duration-200">
    <div id="root" class="h-full w-full overflow-hidden flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
